[project]
name = "football-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Paul Guignard", email = "guignardpa@cy-tech.fr" }
]
requires-python = ">=3.10"
# Only what the API needs to serve the model. Everything used to load the
# data, train and track models is in the "train" group below, so the Docker
# image stays small
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.162",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "skops>=0.16",
    "uvicorn>=0.54",
]

[project.scripts]
football-ai = "football_ai:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.14",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
train = [
    "matplotlib>=3.10.9",
    "mlflow>=3.18.0",
    "mplsoccer>=1.8.1",
    "statsbombpy>=1.22.0",
    "torch>=2.9",
]

# A plain `uv sync` still installs everything; the Docker image asks for
# `--no-default-groups` to get the API's dependencies only
[tool.uv]
default-groups = ["dev", "train"]

# PyTorch's CPU build: no graphics card needed, and far lighter than the
# default Linux build, which ships the NVIDIA libraries
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

# explicit = true: this index is only used for torch, everything else still
# comes from PyPI
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true